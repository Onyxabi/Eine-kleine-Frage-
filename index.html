
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eine kleine Frage ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #171717, #292929, #111111);
  overflow: hidden;
  text-align: center;
  padding: 20px;
}

.card {
  background: #ffffff;
  padding: 45px 30px;
  border-radius: 28px;
  max-width: 550px;
  width: 100%;
  box-shadow: 0 15px 50px #00000060;
  position: relative;
  z-index: 2;
}

.heart {
  font-size: 70px;
  animation: beat 1s infinite;
}

@keyframes beat {
  50% { transform: scale(1.15); }
}

h1 {
  color: #111111;
  font-size: 29px;
}

p {
  color: #111111;
  font-size: 17px;
  line-height: 1.8;
}

button {
  border: none;
  padding: 17px 35px;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  background: #ed6390;
  color: white;
  transition: .2s;
  margin-top: 20px;
}

button:hover {
  transform: scale(1.08);
  background: #d94377;
}

#result {
  display: none;
  margin-top: 25px;
  color: #111111;
  font-size: 20px;
  font-weight: bold;
}

.floating {
  position: absolute;
  bottom: -30px;
  animation: floatUp 8s linear infinite;
  opacity: .8;
  pointer-events: none;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="heart">❤️</div>

  <h1>Hey du!</h1>

  <p>
    Ich habe eine kleine Frage an dich ...
    <br><br>
    Ich verbringe wirklich gerne Zeit mit dir
    und würde dich gerne noch besser kennenlernen.
    <br><br>
    Deshalb wollte ich dich fragen:
  </p>

  <h1>Möchtest du mit mir auf ein Date gehen? ❤️</h1>

  <button onclick="sayYes()">
    JA, SEHR GERNE! 💕
  </button>

  <div id="result"></div>

</div>

<!-- Verstecktes Formular für die E-Mail -->
<iframe name="email-frame" style="display:none;"></iframe>

<form
  id="emailForm"
  action="https://formsubmit.co/DEINE-EMAIL@BEISPIEL.DE"
  method="POST"
  target="email-frame"
  style="display:none;"
>
  <input type="hidden" name="_subject" value="❤️ Sie hat JA gesagt!">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="Nachricht"
         value="Sie hat auf deiner Date-Seite JA geklickt! ❤️">
</form>

<script>
function sayYes() {

  document.querySelector('button').style.display = 'none';

  document.getElementById('result').style.display = 'block';

  document.getElementById('result').innerHTML =
    'WIR HABEN EIN DATE!!! 🥹❤️ Ich freue mich schon riesig! 💗';

  for (let i = 0; i < 50; i++) {

    let heart = document.createElement('div');

    heart.innerHTML = '❤️';
    heart.className = 'floating';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration =
      (3 + Math.random() * 5) + 's';

    document.body.appendChild(heart);
  }

  // E-Mail versenden
  document.getElementById('emailForm').submit();
}
</script>

</body>
</html>
